<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Web Tech Project</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-gray-100 p-8">
    <div id="app" class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow-lg">
        <h2 class="text-2xl font-bold mb-6">Contact me</h2>
        
        <form id="contactForm" action="process.php" method="POST">
            <div class="mb-4">
                <label class="block text-gray-700">Full Name</label>
                <input type="text" name="fullname" id="fullname" class="w-full p-2 border rounded">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700">Email Address</label>
                <input type="text" name="email" id="email" class="w-full p-2 border rounded">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700">Phone Number</label>
                <input type="text" name="phone" id="phone" class="w-full p-2 border rounded">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700">Subject</label>
                <select name="subject" id="subject" class="w-full p-2 border rounded">
                    <option value="">Select a topic</option>
                    <option value="feedback">Feedback</option>
                    <option value="support">Support</option>
                </select>
            </div>

            <div class="mb-4">
                <p class="text-gray-700">Gender:</p>
                <label><input type="radio" name="gender" value="male"> Male</label>
                <label class="ml-4"><input type="radio" name="gender" value="female"> Female</label>
            </div>

            <div class="mb-6">
                <label><input type="checkbox" name="terms" id="terms"> I agree to the terms</label>
            </div>

            <div class="flex flex-col gap-4">
                <button type="button" onclick="validateNativeJS()" class="bg-blue-600 text-white px-6 py-2 rounded-full hover:bg-blue-700">
                    Submit (Native JS Validation)
                </button>

                <button type="button" @click="validateVue" class="bg-green-500 text-white px-6 py-2 rounded-full hover:bg-green-600">
                    Submit (Vue.js Validation)
                </button>
            </div>
        </form>
    </div>

    <script>
        // BUTTON 1: Native JavaScript
        function validateNativeJS() {
            const form = document.getElementById('contactForm');
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (email === "" || !emailPattern.test(email)) {
                alert("Native JS: Please enter a valid email.");
                return;
            }
            if (phone.trim() === "") {
                alert("Native JS: Phone is required.");
                return;
            }
            
            alert("Native JS Validated! Sending to process.php...");
            form.submit();
        }

        // BUTTON 2: Vue.js Framework
        const { createApp } = Vue;
        createApp({
            methods: {
                validateVue() {
                    const email = document.getElementById('email').value;
                    const terms = document.getElementById('terms').checked;
                    
                    if (!email.includes('@')) {
                        alert("Vue.js: Invalid Email Format!");
                        return;
                    }
                    if (!terms) {
                        alert("Vue.js: You must agree to the terms!");
                        return;
                    }

                    alert("Vue.js Validated! Sending to process.php...");
                    document.getElementById('contactForm').submit();
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
