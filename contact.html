<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Web Tech Project</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-gray-100 p-8">
    <div id="app" class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow-lg">
        <h2 class="text-2xl font-bold mb-6">Contact me </h2>
        
        <form id="contactForm" action="process.php" method="POST">
            <div class="mb-4">
                <label class="block text-gray-700">Full Name</label>
                <input type="text" name="fullname" id="fullname" class="w-full p-2 border rounded">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700">Email Address</label>
                <input type="text" name="email" id="email" class="w-full p-2 border rounded">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700">Phone Number</label>
                <input type="text" name="phone" id="phone" class="w-full p-2 border rounded">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700">Subject</label>
                <select name="subject" id="subject" class="w-full p-2 border rounded">
                    <option value="">Select a topic</option>
                    <option value="feedback">Feedback</option>
                    <option value="support">Support</option>
                </select>
            </div>

            <div class="mb-4">
                <p class="text-gray-700">Gender:</p>
                <label><input type="radio" name="gender" value="male"> Male</label>
                <label class="ml-4"><input type="radio" name="gender" value="female"> Female</label>
            </div>

            <div class="mb-6">
                <label><input type="checkbox" name="terms" id="terms"> I agree to the terms</label>
            </div>

            <div class="flex gap-4">
                <button type="button" onclick="validateNativeJS()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                    Submit (Native JS)
                </button>
                <button type="button" @click="validateVue" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
                    Submit (Vue.js)
                </button>
            </div>
        </form>
    </div>

    <script>
        // --- BUTTON 1: Native JavaScript Validation ---
        function validateNativeJS() {
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const phonePattern = /^\d+$/; // Only digits [cite: 16]

            if (email === "" || !emailPattern.test(email)) {
                alert("Please enter a valid email via Native JS.");
                return;
            }
            if (!phonePattern.test(phone)) {
                alert("Phone must contain only numbers.");
                return;
            }
            document.getElementById('contactForm').submit();
        }

        // --- BUTTON 2: Vue.js Framework Validation ---
        const { createApp } = Vue;
        createApp({
            methods: {
                validateVue() {
                    const email = document.getElementById('email').value;
                    if (!email.includes('@')) {
                        alert("Vue.js: Invalid Email Format!");
                    } else {
                        document.getElementById('contactForm').submit();
                    }
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
