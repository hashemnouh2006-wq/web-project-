<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interests - Game of Thrones</title>
    <style>
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: white; /* Fixes the green background issue */
            color: #333;
            margin: 0;
            padding: 20px;
            text-align: center;
            background-color: gray;
            color: brown;
        }

        .interests-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .api-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .api-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 15px;
            transition: 0.3s;
        }

        .api-card:hover { transform: translateY(-5px); }

        .api-card img {
            width: 100%;
            border-radius: 8px;
            height: 160px;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="interests-container">
        <h1> One Of My Interests: Game of Thrones</h1>
        <p>this show is my favorite because of it i started reading about history of the castles in history !! </p>
        <p>Data fetched live from the TVmaze API.</p>

        <div id="got-container" class="api-grid">
            <p>Connecting to the Seven Kingdoms...</p>
        </div>
    </div>

    <script>
        async function fetchGoT() {
            const container = document.getElementById('got-container');
            
            try {
                // Fetching the show with ID 82 (Game of Thrones)
                const response = await fetch('https://api.tvmaze.com/shows/82?embed=episodes');
                const data = await response.json();
                
                // Clear the 'Connecting' text
                container.innerHTML = ''; 

                // Pull the first 4 episodes
                const episodes = data._embedded.episodes.slice(0, 4);

                episodes.forEach(ep => {
                    const card = document.createElement('div');
                    card.className = 'api-card';
                    card.innerHTML = `
                        <img src="${ep.image.medium}" alt="${ep.name}">
                        <h3>${ep.name}</h3>
                        <p>Season ${ep.season} | Episode ${ep.number}</p>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error("API Error:", error);
                container.innerHTML = "Error: Kingdom not found. Check your internet.";
            }
        }

        // START THE FUNCTION
        fetchGoT();
        
    </script>
   <a href="index.html"><button style="font-size: 25px; border-radius: 25px;">Home Page</button></a>
</body>
</html>
